<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LinguaGo" />
    <meta name="description" content="AI translation PWA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <title>LinguaGo</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="translator-card enter">
        <div class="toolbar">
          <button id="themeToggleButton" class="toolbar-button theme-action" type="button" aria-label="切换暗黑模式 / Alternar modo escuro">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4V2M12 22v-2M4.93 4.93 3.52 3.52M20.48 20.48l-1.41-1.41M4 12H2M22 12h-2M4.93 19.07l-1.41 1.41M20.48 3.52l-1.41 1.41" />
              <circle cx="12" cy="12" r="4" />
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.6A7.4 7.4 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6Z" />
            </svg>
          </button>
          <button id="settingsButton" class="toolbar-button settings-action" type="button" aria-haspopup="dialog" aria-controls="settingsPanel" aria-label="设置 / Configurações">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z" />
              <path d="M19.2 13.3a7.8 7.8 0 0 0 0-2.6l2-1.5-2-3.4-2.4 1a8 8 0 0 0-2.2-1.3L14.2 3H9.8l-.4 2.5A8 8 0 0 0 7.2 6.8l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 0 2.6l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 2.2 1.3l.4 2.5h4.4l.4-2.5a8 8 0 0 0 2.2-1.3l2.4 1 2-3.4-2-1.5Z" />
            </svg>
          </button>
        </div>

        <label class="input-wrap">
          <span id="inputLabel">输入 / Entrada</span>
          <textarea
            id="textInput"
            rows="1"
            autocomplete="off"
            placeholder="输入或粘贴文本 / Digite ou cole o texto..."
          ></textarea>
        </label>

        <div class="action-bar">
          <button id="clearButton" class="icon-button clear-action" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7l10 10M17 7L7 17" />
            </svg>
            <span data-i18n="clear">清空 / Limpar</span>
          </button>
          <button id="translateButton" class="primary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 5h8M9 3v2M4 11c3.8-.2 6.9-2.6 8-6" />
              <path d="M7 8c1.1 1.7 2.5 2.9 4.2 3.6" />
              <path d="M14 19l3-7 3 7M15.2 16h3.6" />
            </svg>
            <span data-i18n="translate">翻译 / Traduzir</span>
          </button>
        </div>
      </section>

      <div id="settingsOverlay" class="settings-overlay hidden" aria-hidden="true">
        <section id="settingsPanel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
          <div class="settings-head">
            <strong id="settingsTitle" data-i18n="settings">设置 / Configurações</strong>
            <button id="closeSettingsButton" class="modal-close" type="button" aria-label="关闭设置 / Fechar configurações">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7l10 10M17 7L7 17" />
              </svg>
            </button>
          </div>
          <label class="setting-field">
            <span data-i18n="platform">平台 / Plataforma</span>
            <select id="providerSelect">
              <option value="auto">Auto</option>
              <option value="openrouter">OpenRouter</option>
              <option value="dashscope">阿里云百炼 / Alibaba Cloud Bailian</option>
              <option value="gemini">Gemini</option>
            </select>
          </label>
          <label class="setting-field">
            <span data-i18n="model">模型名称 / Nome do modelo</span>
            <input id="modelInput" type="text" autocomplete="off" placeholder="qwen3.6-flash-2026-04-16" />
          </label>
          <div class="model-tools">
            <button id="saveModelButton" type="button" data-i18n="saveModel">修改 / Salvar</button>
            <button id="verifyModelButton" type="button" data-i18n="verifyModel">验证 / Verificar</button>
          </div>
          <p id="modelStatus" class="model-status"></p>
          <p id="dictionaryStats" class="dictionary-stats">词典同步中 / Sincronizando</p>
        </section>
      </div>

      <section id="resultCard" class="result-card enter hidden">
        <div class="result-head">
          <span id="modeBadge" class="mode-badge">准备就绪 / Pronto</span>
          <span id="statusText" class="status-text">等待输入 / Aguardando</span>
        </div>

        <div id="resultLanguageTabs" class="result-language-tabs" aria-label="选择翻译语言 / Escolher idioma da tradução"></div>
        <div id="translationCard" class="content-card translation-card"></div>
        <div id="wordDetailsWrap" class="word-details-wrap hidden">
          <div class="section-label" data-i18n="wordDetails">单词解释 / Explicação da palavra</div>
          <div id="wordDetailsList" class="word-details-list"></div>
        </div>
        <div id="sentenceExplainWrap" class="sentence-explain-wrap hidden">
          <div class="section-label" data-i18n="sentenceExplain">句子解释 / Explicação da frase</div>
          <div id="sentenceExplainText" class="content-card sentence-explain"></div>
        </div>
        <div id="examplesWrap" class="examples-wrap hidden">
          <div class="section-label" data-i18n="examples">例句 / Exemplos</div>
          <div id="examplesList" class="examples-list"></div>
        </div>
      </section>

      <section class="history-card enter">
        <div class="history-title">
          <span data-i18n="history">历史 / Histórico</span>
          <button id="clearHistoryButton" class="text-button" type="button">
            <span data-i18n="clear">清空 / Limpar</span>
          </button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
