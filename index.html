<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121417" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: light)" content="default" />
    <meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: dark)" content="black" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LinguaGo" />
    <meta name="description" content="AI translation PWA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const settings = JSON.parse(localStorage.getItem('linguago-settings-v1') || '{}');
          const themeSettingsVersion = 3;
          const preference =
            settings.themeSettingsVersion === themeSettingsVersion &&
            ['light', 'dark', 'system'].includes(settings.theme)
              ? settings.theme
              : 'system';
          const isSystemDark =
            typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved =
            preference === 'system' ? (isSystemDark ? 'dark' : 'light') : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.backgroundColor = resolved === 'dark' ? '#121417' : '#ffffff';
          document.documentElement.style.colorScheme = resolved;
          const statusStyle = resolved === 'dark' ? 'black' : 'default';
          document.querySelectorAll('meta[name="apple-mobile-web-app-status-bar-style"]').forEach((m) => {
            m.setAttribute('content', statusStyle);
          });
        } catch {
          const isSystemDark =
            typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = isSystemDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = 'system';
          document.documentElement.style.backgroundColor = resolved === 'dark' ? '#121417' : '#ffffff';
          document.documentElement.style.colorScheme = resolved;
          const statusStyle = resolved === 'dark' ? 'black' : 'default';
          document.querySelectorAll('meta[name="apple-mobile-web-app-status-bar-style"]').forEach((m) => {
            m.setAttribute('content', statusStyle);
          });
        }
      })();
    </script>
    <title>LinguaGo</title>
  </head>
  <body>
    <div id="pwa-theme-probe" style="display:none;" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
